name: Build SukiSU Ultra NX563J msm8998
on:
  workflow_dispatch:
  push:
    branches: [ lineage-22.2 ]

env:
  # 你的原始参数 完全保留
  KERNEL_SOURCE: https://github.com/bao188520/android_kernel_nubia_msm8998
  KERNEL_SOURCE_BRANCH: lineage-22.2
  KERNEL_DEFCONFIG: lineageos_nx563j_defconfig
  TARGET_ARCH: arm64
  KERNEL_FILE: Image.gz-dtb
  CLANG_VERSION: r487747c
  SOURCE_BOOT_IMAGE: https://github.com/bao188520/KernelSU_Action_nx563j/raw/refs/heads/master/boot/lineage-22.2-20260710-boot.img
  EXTRA_MAKE_FLAGS: LD=ld.lld LLVM=1 LLVM_IAS=1
  SUKISU_MODE: lkm # lkm / builtin
  TOOLCHAIN_DIR: ${{ github.workspace }}/clang-toolchain

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 系统依赖安装
        run: |
          sudo apt update -y
          sudo apt install -y git ccache flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev liblz4-tool make bc libelf-dev libncurses-dev python3 python3-pip dtc cpio squashfs-tools wget unzip
          pip install pycryptodome

      - name: 克隆内核源码
        run: |
          git clone --depth 1 -b $KERNEL_SOURCE_BRANCH $KERNEL_SOURCE kernel
          cd kernel

      - name: 集成 SukiSU Ultra 驱动
        run: |
          cd kernel
          # 官方集成脚本
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s $SUKISU_MODE
          # 追加必须内核配置
          cat >> arch/$TARGET_ARCH/configs/$KERNEL_DEFCONFIG << EOF
# SukiSU Mandatory Config
CONFIG_KPM=y
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y
CONFIG_KPROBES=y
CONFIG_HAVE_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
CONFIG_FTRACE=y
CONFIG_HAVE_FTRACE_MCOUNT=y
CONFIG_FUNCTION_TRACER=y
CONFIG_FUNCTION_GRAPH_TRACER=y
CONFIG_SYSFS=y
CONFIG_PROC_FS=y
EOF
          # 注入sukisu编译条目
          sed -i '/core-y += kernel\/ mm\/ fs\/ ipc\/ security\/ crypto\/ block\//a obj-y += sukisu/' Makefile

      - name: 下载预编译AOSP Clang r487747c（替代编译llvm，大幅提速）
        run: |
          mkdir -p $TOOLCHAIN_DIR
          cd $TOOLCHAIN_DIR
          # Google官方预编译clang，无需本地编译llvm，规避编译耗时+报错
          wget https://dl.google.com/android/ndk/android-ndk-r25c-linux.zip -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/* ./
          echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH
          export PATH=$TOOLCHAIN_DIR/bin:$PATH

      - name: CCache 编译缓存
        run: |
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV
          ccache -M 12G

      - name: 编译内核 Image.gz-dtb
        run: |
          cd kernel
          export ARCH=$TARGET_ARCH
          export SUBARCH=$TARGET_ARCH
          export PATH=$TOOLCHAIN_DIR/bin:$PATH
          make $KERNEL_DEFCONFIG
          make -j$(nproc) $EXTRA_MAKE_FLAGS $KERNEL_FILE

      - name: 下载原厂boot.img & 解包打包工具
        run: |
          # 下载基准boot
          wget $SOURCE_BOOT_IMAGE -O stock_boot.img
          # 克隆mkbootimg工具
          git clone https://github.com/osm0sis/mkbootimg mkboot
          cp kernel/arch/$TARGET_ARCH/boot/$KERNEL_FILE mkboot/
          cd mkboot
          python3 unpackbootimg -i ../stock_boot.img -o boot_unpack

      - name: 打包全新boot.img
        run: |
          cd mkboot
          BASE=$(cat boot_unpack/base)
          PAGESIZE=$(cat boot_unpack/pagesize)
          CMDLINE=$(cat boot_unpack/cmdline)
          SECOND=$(cat boot_unpack/second_offset)
          TAGS=$(cat boot_unpack/tags_offset)
          RAMDISK=boot_unpack/ramdisk.cpio.gz
          python3 mkbootimg --kernel $KERNEL_FILE --ramdisk $RAMDISK --cmdline "$CMDLINE" --base $BASE --pagesize $PAGESIZE --second_offset $SECOND --tags_offset $TAGS -o suki-boot.img

      - name: 生成AnyKernel3刷机包
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 anykernel
          cp mkboot/suki-boot.img anykernel/boot.img
          cd anykernel
          zip -r SukiSU-NX563J-Lineage22.2.zip *

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-Kernel
          path: |
            mkboot/suki-boot.img
            anykernel/SukiSU-NX563J-Lineage22.2.zip
