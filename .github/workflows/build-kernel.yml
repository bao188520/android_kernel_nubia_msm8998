name: Build Kernel with SukiSU Ultra

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: bao188520/android_kernel_nubia_msm8998
        ref: lineage-22.2
        path: kernel

    - name: Checkout SukiSU Ultra
      run: |
        cd kernel
        # 集成 SukiSU Ultra (内置构建方式)
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

    - name: Configure kernel
      run: |
        cd kernel
        # 使用你的 defconfig 作为基础
        make ARCH=arm64 lineageos_nx563j_defconfig
        # 手动开启 SukiSU Ultra 所需的内核选项
        scripts/config --file .config \
          -e CONFIG_KPM \
          -e CONFIG_KALLSYMS \
          -e CONFIG_KALLSYMS_ALL
        # 可选: 如果 KPROBES 未开启，可以尝试开启，这有助于 LKM 模式工作[reference:1]
        # scripts/config --file .config -e CONFIG_KPROBES

    - name: Build kernel
      run: |
        cd kernel
        # 1. 设置交叉编译工具链 (请替换为你的工具链路径)
        export CROSS_COMPILE=aarch64-linux-android-
        # 2. 设置架构
        export ARCH=arm64
        # 3. 开始编译 (使用合适的线程数)
        make -j$(nproc)

    # --- 从这里开始是打包 boot.img 的步骤，需要你根据内核实际输出定制 ---
    - name: Pack boot image
      run: |
        # 假设编译产物是 arch/arm64/boot/Image.gz-dtb
        # 你需要使用 mkbootimg 工具，将内核(zImage/dtb)与源 boot.img 的 ramdisk 打包
        # 这是一个示例，请替换为正确的路径和参数
        # mkbootimg --kernel kernel/arch/arm64/boot/Image.gz-dtb \
        #           --ramdisk boot/ramdisk.img \
        #           -o boot.img

    - name: Upload boot image
      uses: actions/upload-artifact@v4
      with:
        name: boot-with-sukisu.img
        path: boot.img
