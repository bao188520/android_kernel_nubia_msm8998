name: Build Kernel with SukiSU Ultra

on:
  workflow_dispatch:   # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出内核源码
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: bao188520/android_kernel_nubia_msm8998
          ref: lineage-22.2
          path: kernel

      # 2. 安装 Android NDK r21e（保留 GCC，兼容 4.4 内核）
      - name: Setup Android NDK
        uses: carlsond/actions/android-ndk@v1
        with:
          ndk-version: r21e
          add-to-path: false

      # 3. 集成 SukiSU Ultra（内置构建分支）
      - name: Integrate SukiSU Ultra
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      # 4. 配置内核
      - name: Configure kernel
        run: |
          cd kernel
          # 使用你的 defconfig 作为基础
          make ARCH=arm64 lineageos_nx563j_defconfig

          # 开启 SukiSU Ultra 必需的选项
          scripts/config --file .config -e CONFIG_KPM
          scripts/config --file .config -e CONFIG_KALLSYMS
          scripts/config --file .config -e CONFIG_KALLSYMS_ALL

          # （可选）开启 KPROBES，有助于 LKM 模式稳定性，内置构建也建议开启
          scripts/config --file .config -e CONFIG_KPROBES

          # 关闭 32 位 vDSO 支持，避免构建系统要求 CROSS_COMPILE_ARM32
          scripts/config --file .config -d CONFIG_COMPAT_VDSO

      # 5. 编译内核
      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          # 将 NDK 工具链加入 PATH
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          # 使用 aarch64-linux-android- 前缀（NDK r21e 中仍有对应的 GCC）
          export CROSS_COMPILE=aarch64-linux-android-
          # 虽然关闭了 CONFIG_COMPAT_VDSO，但为了以防万一，仍设置一个占位变量
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          # 开始编译（-j$(nproc) 使用全部核心）
          make -j$(nproc)

      # 6. 打包 boot.img（示例，请根据实际输出调整）
      - name: Pack boot image
        run: |
          # 假设内核编译产物为 arch/arm64/boot/Image.gz-dtb
          # 你需要从原始 boot.img 中提取 ramdisk，然后重新打包
          # 这里仅做示意，实际请参考其他项目的 mkbootimg 用法
          echo "请在此处添加打包 boot.img 的命令"
          # 示例（需提前安装 mkbootimg 工具）：
          # sudo apt-get install -y mkbootimg
          # mkbootimg --kernel kernel/arch/arm64/boot/Image.gz-dtb \
          #           --ramdisk ramdisk.img \
          #           -o boot.img

      # 7. 上传编译产物
      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot-with-sukisu.img
          path: boot.img
