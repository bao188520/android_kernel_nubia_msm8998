name: Build Kernel with SukiSU Ultra for NX563J

on:
  workflow_dispatch:
    # 可选：允许手动指定分支（默认使用 lineagos-22.2）
    inputs:
      branch:
        description: '内核分支 (默认 lineage-22.2)'
        required: false
        default: 'lineage-22.2'
        type: string

env:
  # -------- 用户提供的变量 --------
  KERNEL_SOURCE: https://github.com/bao188520/android_kernel_nubia_msm8998
  KERNEL_SOURCE_BRANCH: lineage-22.2
  KERNEL_DEFCONFIG: lineageos_nx563j_defconfig
  TARGET_ARCH: arm64
  KERNEL_FILE: Image.gz-dtb
  CLANG_VERSION: r487747c
  EXTRA_BUILD_COMMAND: LD=ld.lld LLVM=1 LLVM_IAS=1
  USE_KERNELSU: true
  MAKE_BOOT_IMAGE: true
  BOOT_SIGNATURE: true
  SOURCE_BOOT_IMAGE: https://github.com/bao188520/KernelSU_Action_nx563j/raw/refs/heads/master/boot/lineage-22.2-20260710-boot.img

  # -------- 内部变量 --------
  WORK_DIR: ${{ github.workspace }}
  KERNEL_DIR: ${{ github.workspace }}/kernel
  BOOT_DIR: ${{ github.workspace }}/boot_work
  CLANG_DIR: ${{ github.workspace }}/clang
  ANY_KERNEL_DIR: ${{ github.workspace }}/AnyKernel3

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 1. 检出内核源码（指定分支）
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: bao188520/android_kernel_nubia_msm8998
          path: ${{ env.KERNEL_DIR }}
          ref: ${{ github.event.inputs.branch || env.KERNEL_SOURCE_BRANCH }}

      # 2. 安装必需的系统依赖
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ccache make flex bison bc cpio \
            python3 python3-dev python3-pip \
            libssl-dev libelf-dev \
            device-tree-compiler lz4 \
            zstd \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            unzip wget

      # 3. 下载预编译的 Clang/LLVM
      - name: Download Clang
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          cd ${{ env.CLANG_DIR }}
          # 使用 AOSP 预编译 Clang 的下载方式
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/${{ env.CLANG_VERSION }}/clang-${{ env.CLANG_VERSION }}.tar.gz
          tar -xzf clang-${{ env.CLANG_VERSION }}.tar.gz
          # 设置 PATH
          echo "${{ env.CLANG_DIR }}/bin" >> $GITHUB_PATH

      # 4. 集成 SukiSU Ultra (LKM 模式)
      - name: Integrate SukiSU Ultra
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

      # 5. 配置内核 (使用 defconfig + 启用必要选项)
      - name: Configure Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # 生成默认配置
          make ${{ env.KERNEL_DEFCONFIG }}
          
          # 启用非 GKI 必需的选项
          scripts/config --enable KPM
          scripts/config --enable KALLSYMS
          scripts/config --enable KALLSYMS_ALL
          # 确保 KernelSU 核心选项开启（即使脚本已加，确保生效）
          scripts/config --enable KSU
          
          # 处理依赖
          make olddefconfig

      # 6. 编译内核 (使用 Clang/LLVM)
      - name: Build Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          # 使用 ccache 加速 (可选)
          export CC="ccache clang"
          make -j$(nproc) \
            ARCH=${{ env.TARGET_ARCH }} \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        env:
          # 确保环境变量传递给 make
          LD: ld.lld
          LLVM: 1
          LLVM_IAS: 1

      # 7. 准备打包环境 - 下载基础 boot.img
      - name: Download base boot.img
        run: |
          mkdir -p ${{ env.BOOT_DIR }}
          wget -q -O ${{ env.BOOT_DIR }}/base-boot.img ${{ env.SOURCE_BOOT_IMAGE }}

      # 8. 安装 Android 打包工具 (mkbootimg/unpackbootimg)
      - name: Install Android Tools
        run: |
          sudo apt-get install -y android-sdk-libsparse-utils
          # 从 AOSP 预编译 mkbootimg（或使用 pip 安装）
          pip3 install --user mkbootimg

      # 9. 拆包基础 boot.img 并替换内核
      - name: Repack boot.img with new kernel
        working-directory: ${{ env.BOOT_DIR }}
        run: |
          # 解包
          unpackbootimg -i base-boot.img -o extracted/
          # 复制新内核
          cp ${{ env.KERNEL_DIR }}/arch/arm64/boot/${{ env.KERNEL_FILE }} extracted/kernel
          # 重新打包
          mkbootimg \
            --kernel extracted/kernel \
            --ramdisk extracted/ramdisk \
            --dtb extracted/dtb \
            --dtb_offset $(cat extracted/dtb_offset) \
            --base $(cat extracted/base) \
            --pagesize $(cat extracted/pagesize) \
            --kernel_offset $(cat extracted/kernel_offset) \
            --ramdisk_offset $(cat extracted/ramdisk_offset) \
            --tags_offset $(cat extracted/tags_offset) \
            --cmdline "$(cat extracted/cmdline)" \
            -o boot-new.img
          # 如果需要签名（这里忽略，BOOT_SIGNATURE 暂不实现，因为需私钥）
          # 可预留签名步骤，但建议在刷机时手动签名或使用未签名版本

      # 10. 可选：打包成 AnyKernel3 ZIP（供不同刷机方式选择）
      - name: Build AnyKernel3 ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ${{ env.ANY_KERNEL_DIR }}
          cp ${{ env.KERNEL_DIR }}/arch/arm64/boot/${{ env.KERNEL_FILE }} ${{ env.ANY_KERNEL_DIR }}/
          cd ${{ env.ANY_KERNEL_DIR }}
          zip -r9 kernel-SukiSU-Ultra-$(date +%Y%m%d-%H%M%S).zip * -x .git README.md

      # 11. 上传产物 (boot.img 和 AnyKernel3 ZIP)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NX563J-Kernel-SukiSU-Ultra
          path: |
            ${{ env.BOOT_DIR }}/boot-new.img
            ${{ env.ANY_KERNEL_DIR }}/*.zip
          retention-days: 7
