name: Build Kernel with SukiSU Ultra

# 触发条件配置
on:
  workflow_dispatch: # 保留手动触发的能力，便于平时测试构建
  push:
    branches: [ lineage-22.2 ]
  pull_request:
    branches: [ lineage-22.2 ]

# 全局环境变量配置，用户需根据实际项目需求修改
env:
  KERNEL_SOURCE_REPOSITORY: https://github.com/bao188520/android_kernel_nubia_msm8998
  KERNEL_SOURCE_BRANCH: lineage-22.2
  KERNEL_DEFCONFIG: lineageos_nx563j_defconfig
  SOURCE_BOOT_IMAGE: https://github.com/bao188520/KernelSU_Action_nx563j/raw/refs/heads/master/boot/lineage-22.2-20260710-boot.img
  SUKISU_MODE: main # 非GKI设备使用main模式，即LKM模式
  OUTPUT_DIR: out
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-android-

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
    - name: 安装依赖项
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev \
          git ccache curl wget zip gzip cpio lz4 \
          gcc-aarch64-linux-gnu device-tree-compiler \
          python3-pyelftools --no-install-recommends

    - name: 检出内核源码
      uses: actions/checkout@v4
      with:
        repository: ${{ env.KERNEL_SOURCE_REPOSITORY }}
        ref: ${{ env.KERNEL_SOURCE_BRANCH }}
        path: kernel-source
        fetch-depth: 0

    - name: 集成 SukiSU Ultra
      working-directory: kernel-source
      run: |
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s ${{ env.SUKISU_MODE }}

    - name: 配置内核
      working-directory: kernel-source
      run: |
        make ARCH=${{ env.ARCH }} ${{ env.KERNEL_DEFCONFIG }}
        # 启用SukiSU Ultra必需的内核配置项
        sed -i 's/.*CONFIG_KPM.*/CONFIG_KPM=y/' .config
        sed -i 's/.*CONFIG_KALLSYMS.*/CONFIG_KALLSYMS=y/' .config
        sed -i 's/.*CONFIG_KALLSYMS_ALL.*/CONFIG_KALLSYMS_ALL=y/' .config
        # 验证配置修改结果
        grep -E 'CONFIG_KPM|CONFIG_KALLSYMS|CONFIG_KALLSYMS_ALL' .config

    - name: 编译内核
      working-directory: kernel-source
      run: |
        make ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} -j$(nproc) O=${{ env.OUTPUT_DIR }}

    - name: 准备 boot.img 工具
      run: |
        mkdir -p bootimg-tools
        cd bootimg-tools
        # 下载用户提供的官方基准boot.img
        wget ${{ env.SOURCE_BOOT_IMAGE }} -O source.boot.img
        # 编译安装bootimg解包/打包工具
        git clone https://github.com/pbatard/bootimg-tools.git .
        make
        sudo mv mkbootimg unpackbootimg /usr/local/bin/

    - name: 打包新的 boot.img
      run: |
        mkdir -p bootimg-work
        cd bootimg-work
        # 解包官方基准boot.img
        unpackbootimg -i ../bootimg-tools/source.boot.img
        # 定位编译完成的内核镜像文件
        KERNEL_IMAGE=$(find ../kernel-source/${{ env.OUTPUT_DIR }}/arch/${{ env.ARCH }}/boot/ -name "Image.gz-dtb" -o -name "Image")
        if [ -z "$KERNEL_IMAGE" ]; then
          echo "错误：在内核编译输出目录中未找到任何内核镜像文件，请检查内核编译日志。"
          exit 1
        fi
        # 重新打包生成新的boot.img
        mkbootimg \
          --kernel "${KERNEL_IMAGE}" \
          --ramdisk ../bootimg-tools/source.boot.img-ramdisk.gz \
          --cmdline "$(cat ../bootimg-tools/source.boot.img-cmdline)" \
          --base "$(cat ../bootimg-tools/source.boot.img-base)" \
          --pagesize "$(cat ../bootimg-tools/source.boot.img-pagesize)" \
          -o new-boot.img
        # 移动生成的文件到顶层目录，方便后续上传
        mv new-boot.img ../

    - name: 上传集成SukiSU的boot.img
      uses: actions/upload-artifact@v4
      with:
        name: sukiSU-integrated-boot-img
        path: new-boot.img
        if-no-files-found: error # 如果文件不存在，报错并终止

    - name: 上传完整的内核编译产物
      uses: actions/upload-artifact@v4
      with:
        name: full-kernel-build-artifacts
        path: |
          kernel-source/${{ env.OUTPUT_DIR }}/arch/${{ env.ARCH }}/boot/
          !kernel-source/${{ env.OUTPUT_DIR }}/arch/${{ env.ARCH }}/boot/*.ko
        if-no-files-found: warn
